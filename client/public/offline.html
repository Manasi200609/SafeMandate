<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1428" />
    <title>Offline · Safe Mandate</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#0B1428;color:#F2F0E8;font:16px/1.6 system-ui,sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #293951;border-radius:24px;background:linear-gradient(145deg,#16233A,#101D33);text-align:center}.mark{width:60px;height:60px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #C6FF3855;border-radius:18px;color:#C6FF38;font-size:25px}.eyebrow{color:#AAB7C9;font-size:11px;letter-spacing:.13em}h1{margin:8px 0;font-size:34px;letter-spacing:-.04em}p{color:#AAB7C9;font-size:14px}.warning{margin:22px 0;padding:13px;border:1px solid #E9B65344;border-radius:12px;background:#E9B6530d;color:#E7D9B7;font-size:13px}button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:#C6FF38;color:#172012;font-weight:700;font-size:14px}
    </style>
  </head>
  <body><main class="card"><div class="mark" aria-hidden="true">⌁</div><span class="eyebrow">SAFE MANDATE · OFFLINE</span><h1>You’re offline.</h1><p>Reconnect to view current information.</p><div class="warning">No guardian approval or payment action can be confirmed offline. This page shows no transaction status.</div><button onclick="location.reload()">Try again</button></main></body>
</html>
